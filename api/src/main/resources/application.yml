spring:
  application:
    name: entry-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

entry:
  cors:
    origins: ${ENTRY_CORS_ORIGINS:http://localhost:5173}
  ai:
    mock: ${ENTRY_AI_MOCK:true}
    model: ${ENTRY_AI_MODEL:claude-sonnet-5}
    timeout-seconds: 8

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
