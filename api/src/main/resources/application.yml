spring:
  application:
    name: entry-api
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false

server:
  port: ${PORT:8080}

entry:
  cors:
    origins: ${ENTRY_CORS_ORIGINS:http://localhost:5173}
  ai:
    mock: ${ENTRY_AI_MOCK:true}
    model: ${ENTRY_AI_MODEL:claude-sonnet-5}
    timeout-seconds: 8
  brand:
    popup-id: ${ENTRY_BRAND_POPUP_ID:MCM-SEONGSU-2026}
    issued-place: ${ENTRY_BRAND_ISSUED_PLACE:SEOUL / SEONGSU}
    origin-store-id: ${ENTRY_BRAND_ORIGIN_STORE_ID:KR-SEONGSU}
    origin-store-name: ${ENTRY_BRAND_ORIGIN_STORE_NAME:성수 팝업}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
