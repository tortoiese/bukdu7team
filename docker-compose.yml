# 가비아 클라우드 VM 한 대에 nginx(프론트 정적 파일 + 리버스 프록시) + Spring Boot + Postgres를 올린다.
# BUILD_STEPS.md Phase 8-5 참고. 로컬에서는 docker compose up --build 로 그대로 검증할 수 있다.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: entry
      POSTGRES_USER: entry
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-entry}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  api:
    build: ./api
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/entry
      SPRING_DATASOURCE_USERNAME: entry
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-entry}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ENTRY_AI_MOCK: ${ENTRY_AI_MOCK:-true}
      ENTRY_AI_PROVIDER: ${ENTRY_AI_PROVIDER:-anthropic}
      ENTRY_AI_MODEL: ${ENTRY_AI_MODEL:-claude-sonnet-5}
      ENTRY_AI_OPENAI_MODEL: ${ENTRY_AI_OPENAI_MODEL:-gpt-4o}
      ENTRY_CORS_ORIGINS: ${ENTRY_CORS_ORIGINS:-http://localhost}
      ENTRY_WEB_ORIGIN: ${ENTRY_WEB_ORIGIN:-http://localhost}
      ENTRY_ADMIN_PASSWORD: ${ENTRY_ADMIN_PASSWORD:-entryadmin}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      ENTRY_MAIL_MOCK: ${ENTRY_MAIL_MOCK:-true}
      ENTRY_MAIL_FROM: ${ENTRY_MAIL_FROM:-ENTRY <onboarding@resend.dev>}
    depends_on:
      - postgres
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_BASE: /api/v1
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - api
    restart: unless-stopped

  # 인증서 발급/갱신 전용. 평소엔 대기만 하다가 6시간마다 갱신을 시도한다(안전한 no-op).
  # 최초 발급은 BUILD_STEPS.md 8-6절대로 `docker compose run --rm certbot certonly ...`를 한 번 수동 실행한다.
  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 6h & wait $${!}; done"

volumes:
  postgres_data:
  certbot_conf:
  certbot_www:
