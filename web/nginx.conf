# HTTPS 전환 1단계(BUILD_STEPS.md 8-6절). 인증서를 아직 발급받지 못한 상태에서는 이 파일 그대로 —
# 80번 포트만으로 정상 서비스되고, /.well-known/acme-challenge/ 로 certbot 검증이 통과한다.
# certbot으로 인증서를 처음 발급받은 뒤에는 8-6절의 2단계 nginx.conf(443 서버 블록 + 리다이렉트 추가)로 바꾼다 —
# 인증서 파일이 없는 상태에서 ssl_certificate를 참조하면 nginx가 아예 기동하지 못한다.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Let's Encrypt HTTP-01 검증 경로. certbot 컨테이너가 같은 볼륨에 써둔 파일을 그대로 서빙한다.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # React Router(SPA) — /s/:productId 같은 딥링크도 index.html로 떨어져 클라이언트가 라우팅한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 같은 VM의 api 컨테이너로 리버스 프록시. VITE_API_BASE=/api/v1로 빌드했을 때 쓴다.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
