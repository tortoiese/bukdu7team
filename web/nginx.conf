# HTTPS 전환 2단계(BUILD_STEPS.md 8-6절). 인증서 발급 완료 후 상태 — 80은 ACME 검증 경로만
# 남기고 나머지는 443으로 리다이렉트한다. 인증서가 없는 VM에 이 파일을 그대로 배포하면 nginx가
# ssl_certificate 경로를 못 찾아 기동에 실패하니, 반드시 certbot 발급 이후에만 이 버전을 쓴다.
server {
    listen 80;
    server_name _;

    # Let's Encrypt HTTP-01 검증 경로(갱신 시에도 계속 필요).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/letsencrypt/live/entrypassport.1.201.116.98.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/entrypassport.1.201.116.98.sslip.io/privkey.pem;

    # React Router(SPA) — /s/:productId 같은 딥링크도 index.html로 떨어져 클라이언트가 라우팅한다.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 같은 VM의 api 컨테이너로 리버스 프록시. VITE_API_BASE=/api/v1로 빌드했을 때 쓴다.
    location /api/ {
        proxy_pass http://api:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
